<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosi 62 Krimi</title>
  <style>
    :root {
      color-scheme: light dark;
      --papier: #F4F1EA;
      --anthrazit: #1F1E1B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --papier: #1F1E1B;
        --anthrazit: #F4F1EA;
      }
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--papier);
      color: var(--anthrazit);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      box-sizing: border-box;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      line-height: 1.5;
    }
    p {
      max-width: 36rem;
      margin: 0;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <p>Das Spiel kommt gleich. Live-Koop-Krimi von Jonathan &amp; Raphael.</p>
</body>
</html>
